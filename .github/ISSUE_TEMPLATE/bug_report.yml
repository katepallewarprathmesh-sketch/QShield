name: Bug report
description: Report a reproducible QSHIELD defect (not a security vulnerability)
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        For exploitable vulnerabilities, use the private security reporting link instead.
        Do not include secrets, customer data, or confidential circuit source in public issues.
  - type: input
    id: version
    attributes:
      label: QSHIELD version
      placeholder: e.g. 1.4.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python / OS / install method
      placeholder: e.g. Python 3.12, Linux, pip install qshield
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a small synthetic example. Never paste proprietary circuit source or credentials.
      render: text
    validations:
      required: true
