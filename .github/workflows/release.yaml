name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generate CycloneDX SBOM (JSON + XML)
        run: bash scripts/generate_sbom.sh dist-sbom
      - name: Create or update GitHub Release and attach SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist-sbom/qshield-sbom.json dist-sbom/qshield-sbom.xml dist-sbom/requirements-resolved.txt --clobber
