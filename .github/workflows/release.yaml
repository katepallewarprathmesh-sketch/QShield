name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Confirm tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag_version != version:
              raise SystemExit(f"release tag {tag_version!r} does not match project.version {version!r}")
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[qiskit,cirq,pennylane,formal,braket,plugins,dev]' 'qiskit>=2,<3'
      - name: Lint and type check
        run: |
          ruff check src tests examples benchmarks scripts
          mypy src
      - name: Test tagged source
        run: pytest -q tests

  reproducible-build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build normalized distributions
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$GITHUB_REF_NAME")"
          export SOURCE_DATE_EPOCH
          python -m pip install --disable-pip-version-check 'build==1.6.1'
          python -m build --outdir dist
          python scripts/normalize_sdist.py dist/qshield-*.tar.gz --source-date-epoch "$SOURCE_DATE_EPOCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qshield-rebuild-${{ matrix.replica }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  compare-reproducible-builds:
    needs: reproducible-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qshield-rebuild-a
          path: rebuild-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qshield-rebuild-b
          path: rebuild-b
      - name: Require byte-identical wheel and sdist
        run: |
          set -euo pipefail
          for suffix in whl tar.gz; do
            a_file="$(find rebuild-a -maxdepth 1 -type f -name "*.$suffix" -print -quit)"
            b_file="$(find rebuild-b -maxdepth 1 -type f -name "*.$suffix" -print -quit)"
            test -n "$a_file" && test -n "$b_file"
            test "$(basename "$a_file")" = "$(basename "$b_file")"
            cmp "$a_file" "$b_file"
            sha256sum "$a_file"
          done

  release:
    needs: [verify, compare-reproducible-builds]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generate CycloneDX SBOM (JSON + XML)
        run: bash scripts/generate_sbom.sh dist-sbom
      - name: Create or update GitHub Release and attach SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist-sbom/qshield-sbom.json dist-sbom/qshield-sbom.xml dist-sbom/requirements-resolved.txt --clobber

  pypi:
    needs: [verify, compare-reproducible-builds]
    # Requires a PyPI "pending trusted publisher" configured for this repo
    # (owner katepallewarprathmesh-sketch, repository QShield,
    # workflow release.yaml, environment: pypi). No API tokens stored here.
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qshield-rebuild-a
          path: dist
      - name: Validate distribution descriptions
        run: |
          python3 -m pip install --disable-pip-version-check twine
          python3 -m twine check dist/*
      - name: Attest sdist and wheel provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  ghcr:
    needs: [verify, compare-reproducible-builds]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and push image to GHCR
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          IMG="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/qshield"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMG:$TAG" -t "$IMG:latest" .
          push_output="$(docker push "$IMG:$TAG" 2>&1)"
          printf '%s\n' "$push_output"
          DIGEST="$(printf '%s\n' "$push_output" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n1)"
          test -n "$DIGEST"
          docker push "$IMG:latest"
          {
            echo "image=$IMG"
            echo "digest=$DIGEST"
          } >> "$GITHUB_OUTPUT"
      - name: Attest pushed container image
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
