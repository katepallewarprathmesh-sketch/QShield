name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        qiskit: [">=1.4,<2", ">=2,<3"]
    name: test (${{ matrix.python-version }}, qiskit ${{ matrix.qiskit }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[qiskit,cirq,pennylane,formal,dev]' "qiskit${{ matrix.qiskit }}"
      - name: Lint
        run: ruff check src tests examples benchmarks
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest --cov=qshield --cov-report=term-missing
      - name: Benchmark corpus (TPR/FPR)
        run: python benchmarks/evaluate.py
      - name: "Dynamic benchmark (M2.2 acceptance: TPR/FPR across noise models)"
        run: python benchmarks/evaluate_dynamic.py
      - name: Fuzz the analyzer (M2.3; crashes must be 0)
        run: python benchmarks/fuzz_coverage.py
      - name: Community signature pack (schema + manifest integrity + offline install)
        run: |
          qshield sig validate src/qshield/signatures/community
          python -c "from qshield.signatures.community import verify_pack; errs = verify_pack(); assert not errs, errs; print('pack integrity OK')"
          qshield sig update --offline --install-dir /tmp/qshield_community_ci
          for sig in src/qshield/signatures/community/*.yaml; do
            [ -e "$sig" ] || { echo "(empty pack — nothing to gate)"; break; }
            qshield sig test "$sig" --min-tpr 0.5 --max-fpr 0.1
          done
      - name: Dogfood (self-scan example circuits)
        run: |
          qshield scan tests/fixtures/clean_circuits/bell_state.qasm --fail-on high
          qshield scan tests/fixtures/malicious_circuits/ancilla_leakage.qasm || test $? -eq 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t qshield .
      - name: Non-root check
        run: |
          uid="$(docker run --rm qshield id -u)"
          echo "image uid=$uid"
          test "$uid" != "0"
      - name: Smoke — scan bundled fixture
        run: |
          out="$(docker run --rm qshield qshield scan tests/fixtures/malicious_circuits/ancilla_leakage.qasm --fail-on never)"
          echo "$out"
          echo "$out" | grep -q "T2.1"
      - name: Smoke — fixture corpus visible to Policy Studio
        run: |
          docker run --rm qshield python -c "from qshield.ui.server import FIXTURE_ROOT; assert FIXTURE_ROOT.exists(), FIXTURE_ROOT; print('fixtures at', FIXTURE_ROOT)"

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Generate CycloneDX SBOM (JSON + XML)
        run: bash scripts/generate_sbom.sh dist-sbom
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qshield-sbom
          path: dist-sbom/
          if-no-files-found: error

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install core and optional plugin runtime closures
        run: pip install '.[plugins,braket]'
      - name: pip-audit (fail on known vulnerabilities)
        run: pip install pip-audit && pip-audit --desc on

  pre-commit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Exercise hook in a sample repository
        run: |
          set -euo pipefail
          pre-commit try-repo . qshield-scan --verbose --files tests/fixtures/clean_circuits/bell_state.qasm
          set +e
          pre-commit try-repo . qshield-scan --verbose --files tests/fixtures/malicious_circuits/ancilla_leakage.qasm
          status=$?
          set -e
          test "$status" -eq 1

  plugin-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install optional plugin runtime
        run: python -m pip install -e '.[plugins,dev]'
      - name: Verify versioned WASI plugin contract and sandbox limits
        run: pytest -q tests/unit/test_plugins.py tests/integration/test_wasm_plugins.py

  braket-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Braket parser dependencies
        run: python -m pip install -e '.[braket,dev]'
      - name: Verify Amazon Braket Circuit importer
        run: pytest -q tests/integration/test_braket_importer.py

  docs-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python -m pip install build
      - name: Reject internal docs in source and distributions
        run: |
          python scripts/check_public_docs_boundary.py
          python -m build
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from pathlib import Path
          from qshield.ui.server import FIXTURE_ROOT, _fixture_corpus_available, _policy_eval

          assert _fixture_corpus_available(), FIXTURE_ROOT
          assert len(list((FIXTURE_ROOT / "clean_circuits").glob("*.qasm"))) == 202
          assert len(list((FIXTURE_ROOT / "malicious_circuits").glob("*.qasm"))) == 215
          result = _policy_eval(["POL-001"], sample=1)
          assert result["corpus"]["clean"] == result["corpus"]["malicious"] == 1
          print(f"wheel fixture corpus scoring OK: {FIXTURE_ROOT}")
          PY
          cd "$GITHUB_WORKSPACE"
          python scripts/check_public_docs_boundary.py --dist dist

