name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        qiskit: [">=1.4,<2", ">=2,<3"]
    name: test (${{ matrix.python-version }}, qiskit ${{ matrix.qiskit }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[qiskit,cirq,pennylane,formal,dev]' "qiskit${{ matrix.qiskit }}"
      - name: Lint
        run: ruff check src tests examples benchmarks
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest --cov=qshield --cov-report=term-missing
      - name: Benchmark corpus (TPR/FPR)
        run: python benchmarks/evaluate.py
      - name: "Dynamic benchmark (M2.2 acceptance: TPR/FPR across noise models)"
        run: python benchmarks/evaluate_dynamic.py
      - name: Fuzz the analyzer (M2.3; crashes must be 0)
        run: python benchmarks/fuzz_coverage.py
      - name: Community signature pack (schema + manifest integrity + offline install)
        run: |
          qshield sig validate src/qshield/signatures/community
          python -c "from qshield.signatures.community import verify_pack; errs = verify_pack(); assert not errs, errs; print('pack integrity OK')"
          qshield sig update --offline --install-dir /tmp/qshield_community_ci
          for sig in src/qshield/signatures/community/*.yaml; do
            [ -e "$sig" ] || { echo "(empty pack — nothing to gate)"; break; }
            qshield sig test "$sig" --min-tpr 0.5 --max-fpr 0.1
          done
      - name: Dogfood (self-scan example circuits)
        run: |
          qshield scan tests/fixtures/clean_circuits/bell_state.qasm --fail-on high
          qshield scan tests/fixtures/malicious_circuits/ancilla_leakage.qasm || test $? -eq 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t qshield .
      - name: Non-root check
        run: |
          uid="$(docker run --rm qshield id -u)"
          echo "image uid=$uid"
          test "$uid" != "0"
      - name: Smoke — scan bundled fixture
        run: |
          out="$(docker run --rm qshield qshield scan tests/fixtures/malicious_circuits/ancilla_leakage.qasm --fail-on never)"
          echo "$out"
          echo "$out" | grep -q "T2.1"
      - name: Smoke — fixture corpus visible to Policy Studio
        run: |
          docker run --rm qshield python -c "from qshield.ui.server import FIXTURE_ROOT; assert FIXTURE_ROOT.exists(), FIXTURE_ROOT; print('fixtures at', FIXTURE_ROOT)"

