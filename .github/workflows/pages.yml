name: pages

# Builds the GitHub Pages site — the REAL QSHIELD engine running in the
# visitor's browser (self-hosted Pyodide, no CDN) — and deploys it to the
# gh-pages branch with a fast-forward push. Pull requests build and verify
# the site but never deploy.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "pyproject.toml"
      - "scripts/build_static_site.py"
      - "scripts/site/**"
      - "frontend/**"
      - "scripts/static_demo_canned/**"
      - "src/qshield/**"
      - "tests/fixtures/**"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "pyproject.toml"
      - "scripts/build_static_site.py"
      - "scripts/site/**"
      - "frontend/**"
      - "scripts/static_demo_canned/**"
      - "src/qshield/**"
      - "tests/fixtures/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed only for the ff-push to gh-pages (read-only on PRs)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build TypeScript UI assets
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Build site (sha256-verified, vendored, no CDN)
        run: python3 scripts/build_static_site.py --out dist-site

      - name: Sanity-check built site
        run: |
          test -f dist-site/index.html
          test -f dist-site/workbench.html
          test -f dist-site/security-architecture.html
          grep -q 'security-architecture.html' dist-site/threat-model.html
          test -f dist-site/assets/workbench.js
          grep -q './assets/workbench.js' dist-site/workbench.html
          grep -q 'Open the Workbench' dist-site/index.html
          grep -q 'href="workbench.html"' dist-site/index.html
          test "$(find dist-site -maxdepth 1 -type f -name 'bootstrap.*.js' | wc -l)" -eq 1
          grep -Eq 'bootstrap\.[0-9a-f]{12}\.js' dist-site/workbench.html
          test -f dist-site/vendor/qshield.whl
          test -f dist-site/vendor/fixtures.zip
          grep -q '"corpus_available": __srv._fixture_corpus_available()' scripts/site/bootstrap.js
          test "$(find dist-site/vendor/pyodide -type f | wc -l)" -ge 9
          ! grep -qi 'static demo' dist-site/index.html dist-site/workbench.html
          python scripts/check_public_docs_boundary.py --site dist-site
          echo "site sanity checks OK"

      - name: Deploy to gh-pages (fast-forward, history preserved)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          git clone --quiet --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tmpdir"
          find "$tmpdir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r dist-site/. "$tmpdir"/
          cd "$tmpdir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "site unchanged — nothing to deploy"
            exit 0
          fi
          git commit -q -m "deploy: Workbench site — real in-browser engine (${GITHUB_SHA::7})"
          git push origin HEAD:gh-pages
