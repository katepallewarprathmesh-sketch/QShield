[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qshield"
version = "0.1.0"
description = "Quantum Software Supply Chain Security Framework"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "QSHIELD Contributors", email = "qshield@example.org" }
]
keywords = ["quantum", "security", "supply-chain", "static-analysis", "backdoor", "trojan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Physics",
]

# ===== Core Dependencies =====
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "typer>=0.9",
    "rich>=13.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Additional quantum frameworks (parsers)
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.13"]
cirq = ["cirq-core>=1.3"]
pennylane = ["pennylane>=0.33"]
all-frameworks = ["qshield[qiskit,cirq,pennylane]"]

# Formal verification
formal = [
    "pyzx>=0.8",
    "z3-solver>=4.12",
]

# Development
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.82",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
qshield = "qshield.cli.main:app"

[project.urls]
Homepage = "https://github.com/qshield/qshield"
Documentation = "https://qshield.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qshield" = ["signatures/builtin/*.yaml", "reporting/templates/*.jinja2"]

[tool.pytest.ini_options]
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "RUF", "S", "TRY"]
# B008: typer relies on function calls in argument defaults (idiom)
# BLE001: QSHIELD deliberately catches broad exceptions at analysis boundaries
#         so one bad circuit/signature never aborts a scan
ignore = [
    "B008",    # typer idiom: calls in argument defaults
    "BLE001",  # QSHIELD catches broad exceptions at analysis boundaries by design
    "TRY003",  # descriptive messages in raised exceptions are intentional
    "E501",    # long user-facing strings / QASM snippets kept readable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"examples/**" = ["S101"]
"benchmarks/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
